# Folio 收书 notifications. Lives in your PRIVATE data repository as
# .github/workflows/folio-push.yml (it replaces the test workflow folio-push-test.yml).
# Runs when the 收书 bookmark has finished a batch (repository_dispatch folio-collected, sent once per
# batch) or by hand from the Actions tab (Run workflow: a test message). It never runs on pushes, so
# syncing, backups and Folio's own commits never start it. Needs the secret FOLIO_VAPID_PRIVATE_KEY.
name: Folio push
on:
  workflow_dispatch:
  repository_dispatch:
    types: [folio-collected]
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: push
      - name: Send the notification
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.FOLIO_VAPID_PRIVATE_KEY }}
          EVENT: ${{ toJSON(github.event.client_payload) }}
        run: |
          cat > send.mjs <<'SCRIPT'
          // Sends one 收书 notification to every device in push/subscription*.json (run by folio-push.yml).
          // Built-in Node modules only: VAPID (RFC 8292) signs the request, the payload is encrypted with
          // aes128gcm (RFC 8291). The private key comes from the environment (an Actions secret), never a
          // file, and is never printed. EVENT is the dispatch's client_payload: { ok, failed, titles, last }.
          import { readFileSync, readdirSync, existsSync } from 'node:fs';
          import crypto from 'node:crypto';

          const b64u = b => Buffer.from(b).toString('base64url');
          const un64 = s => Buffer.from(s, 'base64url');
          const fail = msg => { console.error(msg); process.exit(1); };
          console.log(`Node ${process.version}`);

          // Every device that turned notifications on has its own file (push/subscription.json: the one device from before v1.3.4)
          const DIR = process.env.SUB_DIR || 'push';
          const files = existsSync(DIR) ? readdirSync(DIR).filter(f => /^subscription[^/]*\.json$/.test(f)).sort() : [];
          if (!files.length) { console.log('No device has turned notifications on (no push/subscription*.json): nothing to send.'); process.exit(0); }

          // The message: what this batch did, exactly. A manual run (no event) sends a test message.
          const ev = (() => { try { return JSON.parse(process.env.EVENT || '{}') || {}; } catch { return {}; } })();
          const ok = Math.max(0, Math.floor(+ev.ok || 0)), failed = Math.max(0, Math.floor(+ev.failed || 0));
          const titles = (Array.isArray(ev.titles) ? ev.titles : []).map(t => String(t).trim().slice(0, 24)).filter(Boolean).slice(0, 3);
          const manual = !('ok' in ev);
          // New books and updates of books already on the shelf are told apart (older bookmarks send no count: all new)
          const upd = Math.min(ok, Math.max(0, Math.floor(+ev.updated || 0)));
          const what = upd >= ok ? `${ok} 本书有更新` : upd ? `收到 ${ok - upd} 本新书，更新 ${upd} 本` : `${ok} 本新书已送到`;
          if (!manual && !ok) { console.log('Nothing arrived in this batch: no notification.'); process.exit(0); }
          const names = titles.length ? titles.slice(0, 2).join('、') + (ok > 2 && titles.length ? ' 等' : '') : '';
          const notification = manual
            ? { title: 'Folio 测试通知', body: '收书通知工作正常。点开会打开 Folio。' }
            : { title: what + (failed ? `，失败 ${failed} 本` : ''),
                body: `${names ? `${names}。` : ''}${upd >= ok ? '点开更新书架。' : '点开收进书架并打开。'}${failed ? '失败的作品，再点一次收书书签可以重试。' : ''}` };
          // Tapping it opens Folio on the last work that arrived (Folio falls back to the shelf if it cannot find it)
          const last = ev.last && typeof ev.last === 'object' ? ev.last : null;
          const lastId = String(last?.id || '').replace(/[^\w-]/g, '').slice(0, 40);

          // The VAPID key: checked before use, with messages that never show the key itself
          const d = (process.env.VAPID_PRIVATE_KEY || '').trim();
          if (!d) fail('The secret FOLIO_VAPID_PRIVATE_KEY is empty or missing.');
          if (!/^[A-Za-z0-9_-]{43}$/.test(d)) fail(`The secret FOLIO_VAPID_PRIVATE_KEY is not in the expected form (43 characters, letters, digits, - and _; it has ${d.length}). Paste exactly the key Folio showed.`);
          let mine;
          try { const e = crypto.createECDH('prime256v1'); e.setPrivateKey(un64(d)); mine = e.getPublicKey(); }
          catch { fail('The secret FOLIO_VAPID_PRIVATE_KEY is not a valid key. Paste exactly the key Folio showed.'); }
          const key = crypto.createPrivateKey({ format: 'jwk', key: { kty: 'EC', crv: 'P-256', d, x: b64u(mine.subarray(1, 33)), y: b64u(mine.subarray(33, 65)) } });

          const hkdf = (s, ikm, info, len) => Buffer.from(crypto.hkdfSync('sha256', ikm, s, info, len));
          async function sendTo(file) {
            const sub = JSON.parse(readFileSync(`${DIR}/${file}`, 'utf8'));
            const who = `${file}${sub.device ? ` (${sub.device})` : ''}`;
            const pub = un64(sub.vapidPublic || '');
            if (pub.length !== 65 || pub[0] !== 4) { console.error(`${who}: no valid public key; turn notifications on again on that device.`); return false; }
            if (!mine.equals(pub)) {
              console.error(`${who}: the secret belongs to another key pair (secret's public key starts ${b64u(mine).slice(0, 8)}, this subscription's starts ${sub.vapidPublic.slice(0, 8)}). `
                + 'Turn notifications off and on again on that device, or put the private key Folio showed into the secret.');
              return false;
            }
            const open = new URL('./', sub.app);
            open.searchParams.set('from', 'push');
            if (!manual && lastId) { open.searchParams.set('book', lastId); if (last.title) open.searchParams.set('t', String(last.title).slice(0, 80)); }
            const payload = { web_push: 8030, notification: { ...notification, navigate: open.href, silent: false } };

            // VAPID JWT (ES256)
            const head = b64u(JSON.stringify({ typ: 'JWT', alg: 'ES256' }));
            const claims = b64u(JSON.stringify({ aud: new URL(sub.endpoint).origin, exp: Math.floor(Date.now() / 1000) + 12 * 3600, sub: sub.subject }));
            const jwt = `${head}.${claims}.${b64u(crypto.sign('sha256', Buffer.from(`${head}.${claims}`), { key, dsaEncoding: 'ieee-p1363' }))}`;

            // aes128gcm encryption (RFC 8291), one record
            const ua = un64(sub.keys.p256dh), auth = un64(sub.keys.auth);
            const ecdh = crypto.createECDH('prime256v1'); ecdh.generateKeys();
            const as = ecdh.getPublicKey(), secret = ecdh.computeSecret(ua), salt = crypto.randomBytes(16);
            const ikm = hkdf(auth, secret, Buffer.concat([Buffer.from('WebPush: info\0'), ua, as]), 32);
            const cek = hkdf(salt, ikm, Buffer.from('Content-Encoding: aes128gcm\0'), 16);
            const nonce = hkdf(salt, ikm, Buffer.from('Content-Encoding: nonce\0'), 12);
            const c = crypto.createCipheriv('aes-128-gcm', cek, nonce);
            const ct = Buffer.concat([c.update(Buffer.concat([Buffer.from(JSON.stringify(payload)), Buffer.from([2])])), c.final(), c.getAuthTag()]);
            const rs = Buffer.alloc(4); rs.writeUInt32BE(4096);
            const body = Buffer.concat([salt, rs, Buffer.from([as.length]), as, ct]);

            if (process.env.DRY_RUN) { process.stdout.write(JSON.stringify({ file, jwt, body: b64u(body), payload }) + '\n'); return true; }
            const res = await fetch(sub.endpoint, { method: 'POST', body, headers: {
              Authorization: `vapid t=${jwt}, k=${sub.vapidPublic}`, TTL: '86400', Urgency: 'high',
              'Content-Encoding': 'aes128gcm', 'Content-Type': 'application/octet-stream' } });
            console.log(`${who}: push service (${new URL(sub.endpoint).host}) answered ${res.status} ${await res.text()}; opens ${open.search}`);
            if (res.status === 404 || res.status === 410) { console.error(`${who}: this subscription is no longer valid; turn notifications on again on that device (设备同步 → 收书通知).`); return false; }
            return res.ok;
          }

          console.log(manual ? 'Test message' : `Batch: ${ok} arrived, ${failed} failed; last: ${lastId || '(none)'}`);
          if (ev.at) console.log(`From the end of the batch to sending: ${Math.round((Date.now() - ev.at) / 1000)} s`);
          let sent = 0;
          for (const f of files) { try { if (await sendTo(f)) sent++; } catch (e) { console.error(`${f}: ${e.message}`); } }
          console.log(`Sent to ${sent} of ${files.length} device(s).`);
          if (!sent) fail('No device received the notification.');
          SCRIPT
          node send.mjs
