<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Folio</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Standalone (Add to Home Screen) support -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Folio">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.png">

  <link rel="stylesheet" href="fonts/sans/sans.css?v=1.3.16">
  <link rel="stylesheet" href="style.css?v=1.3.16">
</head>
<body>

  <!-- Library -->
  <section id="shelf">
    <header class="shelf-head">
      <h1>我的书架</h1>
      <div class="head-actions">
        <button id="btn-search" class="icon-btn" aria-label="搜索书架">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        </button>
        <button id="btn-refresh" class="icon-btn" aria-label="刷新书架">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20.5V16h-4.5"/></svg>
        </button>
        <button id="btn-stats" class="icon-btn" aria-label="阅读统计">
          <svg viewBox="0 0 24 24" width="21" height="21"><path d="M5 20V11M12 20V5M19 20v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-more" class="icon-btn" aria-label="更多">⋯</button>
        <button id="btn-import" class="import-btn">＋ 导入</button>
        <input type="file" id="picker" accept=".html,.htm,.txt,.epub,.pdf,.zip,text/html,text/plain,application/epub+zip,application/pdf,application/zip" multiple hidden>
      </div>
    </header>

    <input type="file" id="cover-picker" accept="image/*" hidden>

    <!-- Multi-select mode -->
    <div id="select-top" class="select-top hidden">
      <button class="text-btn muted" data-close>完成</button>
      <span class="st-count">选择书籍</span>
      <button class="text-btn" data-sa>全选</button>
    </div>
    <div id="select-bar" class="select-bar hidden">
      <button data-act="pin" data-icon="pin" data-label="置顶"></button>
      <button data-act="move" data-icon="folder" data-label="文件夹"></button>
      <button data-act="tags" data-icon="tag" data-label="标签"></button>
      <button data-act="cover" data-icon="image" data-label="封面"></button>
      <button data-act="more" data-icon="more" data-label="更多"></button>
    </div>

    <!-- Reading statistics -->
    <div id="stats-sheet" class="sheet-modal fixed hidden">
      <div class="sheet-card tall stats-card">
        <div class="sheet-grip"></div>
        <div class="sheet-head">
          <button class="sheet-x" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="sheet-tabs"><button class="on">阅读统计</button></div>
          <span></span>
        </div>
        <div class="st-tabs"></div>
        <div class="sheet-scroll st-body"></div>
      </div>
    </div>

    <!-- More menu: backup / restore -->
    <div id="more-sheet" class="sheet-modal fixed hidden">
      <div class="sheet-card">
        <div class="sheet-grip"></div>
        <button class="sheet-item" id="btn-tags">标签管理<small>新建、改名、合并、删除自己的标签</small></button>
        <button class="sheet-item" id="btn-trash">回收站<small id="trash-sub">删除的书在这里放 30 天，可以恢复</small></button>
        <button class="sheet-item" id="btn-sync">设备同步<small id="sync-sub">手机和电脑共用一个书架</small></button>
        <button class="sheet-item" id="btn-backup">备份书架<small>所有书、进度、笔记、文件夹和设置，存成一个文件</small></button>
        <label class="sheet-item">恢复备份<small>选之前存的备份文件</small>
          <input type="file" id="restore-picker" accept=".zip,.json,application/zip,application/json" hidden>
        </label>
        <button class="sheet-item hidden" id="btn-undo-restore">撤销上次恢复<small>回到上次恢复备份之前的书架</small></button>
        <button class="sheet-item cancel" id="btn-more-close">取消</button>
        <div class="app-version">Folio v1.3.16</div>
      </div>
    </div>
    <div class="shelf-sub">
      <p id="shelf-count" class="shelf-count"></p>
      <div class="sub-acts">
        <button id="btn-filter" class="mode-btn filter-btn hidden" aria-label="筛选"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></svg><i class="filter-n"></i></button>
        <button id="btn-sort" class="mode-btn sort-btn hidden" aria-label="排序"></button>
        <button id="btn-mode" class="mode-btn hidden" aria-label="展示模式"></button>
        <button id="btn-select" class="text-btn hidden">选择</button>
      </div>
    </div>
    <div id="search-bar" class="search-bar hidden">
      <input id="search-input" type="search" placeholder="书名、作者、CP、角色、标签" autocomplete="off" enterkeyhint="search">
      <button id="search-cancel" class="search-cancel">取消</button>
      <div class="search-modes"><button data-mode="books" class="on">书目</button><button data-mode="text">正文</button><button data-mode="notes">摘录</button></div>
    </div>
    <div id="new-arrivals" class="new-arrivals hidden"></div>
    <div id="continue" class="continue hidden"></div>
    <button id="shelf-theme" class="shelf-theme" aria-label="切换底色"><span></span></button>
    <div id="chips" class="chips"></div>
    <div id="grid" class="grid mode-shelf"></div>
  </section>

  <!-- 足迹 and 摘录: empty for now; filled by the calendar (footprints) and excerpts steps -->
  <section id="page-foot" class="tab-page hidden">
    <h1 class="page-title">足迹</h1>
    <div class="empty tab-empty">
      <div class="tab-empty-icon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg></div>
      <p class="empty-title">阅读足迹</p>
      <p class="empty-sub">以后这里会有一本阅读日历：哪天读了哪些书，点一下回到那天读到的地方；还有往年的今天读过什么。</p>
    </div>
  </section>
  <section id="page-clip" class="tab-page hidden">
    <h1 class="page-title">摘录</h1>
    <div class="empty tab-empty">
      <div class="tab-empty-icon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 4.3a1.8 1.8 0 0 1 2.5 0l2 2a1.8 1.8 0 0 1 0 2.5L10.4 18.1 6 19l.9-4.4z"/><path d="m13.6 6 4.4 4.4"/><path d="M4 21.2h16" opacity=".55"/></svg></div>
      <p class="empty-title">摘录</p>
      <p class="empty-sub">以后你的高亮、批注和书评会集中在这里，可以按一本书或全部查看，点一下回到原文。</p>
    </div>
  </section>

  <!-- Bottom navigation: 足迹 · 书架 · 摘录 (hidden in the reader and while selecting books) -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="页面">
    <span class="nav-pill" aria-hidden="true"></span>
    <button data-page="foot" aria-label="足迹"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>足迹</span></button>
    <button data-page="shelf" class="on" aria-label="书架"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H8a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5.5A1.5 1.5 0 0 1 4 18.5zM9 4h3.5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H9M14.6 5.3l2.4-.7a1 1 0 0 1 1.2.7l3.1 12.6a1 1 0 0 1-.7 1.2l-2.4.6a1 1 0 0 1-1.2-.7L13.9 6.5a1 1 0 0 1 .7-1.2z"/></svg><span>书架</span></button>
    <button data-page="clip" aria-label="摘录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 4.3a1.8 1.8 0 0 1 2.5 0l2 2a1.8 1.8 0 0 1 0 2.5L10.4 18.1 6 19l.9-4.4z"/><path d="m13.6 6 4.4 4.4"/><path d="M4 21.2h16" opacity=".55"/></svg><span>摘录</span></button>
  </nav>

  <!-- Reader -->
  <section id="reader" class="hidden">
    <!-- Two identical sheets used as a double buffer: the top one is visible,
         the hidden one is pre-laid-out with the next page. They swap after each turn. -->
    <div id="stack" class="stack">
      <div class="view"><div class="view-inner">
        <div class="running header"></div>
        <div class="page"><div class="flow"></div></div>
        <div class="running footer"></div>
        <div class="ribbon"></div>
        <div class="title-page"></div>
      </div></div>
      <div class="view"><div class="view-inner">
        <div class="running header"></div>
        <div class="page"><div class="flow"></div></div>
        <div class="running footer"></div>
        <div class="ribbon"></div>
        <div class="title-page"></div>
      </div></div>
      <div id="pull-ind" class="pull-ind">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>下拉添加书签</span>
      </div>
      <div id="curl-shadow" class="curl-shadow"></div>
    </div>

    <div id="topbar" class="bar">
      <button id="btn-back">‹ 书架</button>
      <span id="book-title"></span>
      <button id="btn-bookmark" class="bar-icon" aria-label="书签">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="bottombar" class="bar">
      <div class="nav-row">
        <button id="btn-prev-ch" class="ch-btn">上一章</button>
        <div id="scrub" class="scrub">
          <div class="scrub-track"><i class="scrub-fill"></i></div>
          <div class="scrub-knob"></div>
          <div class="scrub-tip"></div>
        </div>
        <button id="btn-next-ch" class="ch-btn">下一章</button>
      </div>
      <!-- A: text size and simplified / original script, in a small panel above the toolbar -->
      <div id="type-panel" class="type-panel hidden">
        <div class="tp-row"><span class="tp-k">字号</span>
          <div class="tp-seg"><button id="btn-smaller" aria-label="字小一点">A−</button><span id="font-size-now"></span><button id="btn-bigger" aria-label="字大一点">A+</button></div></div>
        <div class="tp-row"><span class="tp-k">文字</span>
          <div class="tp-seg"><button id="btn-t2s"><span>原文</span></button></div></div>
      </div>
      <div class="tool-row">
        <button id="btn-toc"><b>☰</b>目录</button>
        <button id="btn-type"><b>A</b>字体</button>
        <button id="btn-theme"><b>◐</b>底色</button>
        <button id="btn-turn"><b>❏</b><span>仿真</span></button>
        <button id="btn-find"><b><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></b>搜索</button>
      </div>
    </div>

    <div id="sel-layer"></div>
    <div id="sel-menu" class="hidden"></div>
    <div id="toc-panel" class="sheet-modal hidden"></div>
    <div id="note-editor" class="hidden"></div>
    <div id="note-panel" class="sheet-modal hidden"></div>
  </section>

  <script src="ui.js?v=1.3.16"></script>
  <script src="lib/t2s.js?v=1.3.16"></script>
  <script src="db.js?v=1.3.16"></script>
  <script src="importer.js?v=1.3.16"></script>
  <script src="formats.js?v=1.3.16"></script>
  <script src="links.js?v=1.3.16"></script>
  <script src="reader.js?v=1.3.16"></script>
  <script src="annotations.js?v=1.3.16"></script>
  <script src="stats.js?v=1.3.16"></script>
  <script src="cover.js?v=1.3.16"></script>
  <script src="epub.js?v=1.3.16"></script>
  <script src="backup.js?v=1.3.16"></script>
  <script src="library.js?v=1.3.16"></script>
  <script src="repo.js?v=1.3.16"></script>
  <script src="sync.js?v=1.3.16"></script>
  <script src="cloud.js?v=1.3.16"></script>
  <script src="migrate.js?v=1.3.16"></script>
  <script src="push.js?v=1.3.16"></script>
  <script src="app.js?v=1.3.16"></script>
  <script src="desktop.js?v=1.3.16"></script>
</body>
</html>
