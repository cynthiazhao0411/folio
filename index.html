<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Folio</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Standalone (Add to Home Screen) support -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Folio">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.png">

  <link rel="stylesheet" href="style.css?v=1.2.3">
</head>
<body>

  <!-- Library -->
  <section id="shelf">
    <header class="shelf-head">
      <h1>我的书架</h1>
      <div class="head-actions">
        <button id="btn-refresh" class="icon-btn" aria-label="刷新书架">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20.5V16h-4.5"/></svg>
        </button>
        <button id="btn-stats" class="icon-btn" aria-label="阅读统计">
          <svg viewBox="0 0 24 24" width="21" height="21"><path d="M5 20V11M12 20V5M19 20v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-more" class="icon-btn" aria-label="更多">⋯</button>
        <button id="btn-import" class="import-btn">＋ 导入</button>
        <input type="file" id="picker" accept=".html,.htm,.txt,.epub,.pdf,.zip,text/html,text/plain,application/epub+zip,application/pdf,application/zip" multiple hidden>
      </div>
    </header>

    <input type="file" id="cover-picker" accept="image/*" hidden>

    <!-- Multi-select mode -->
    <div id="select-top" class="select-top hidden">
      <button class="text-btn muted" data-close>完成</button>
      <span class="st-count">选择书籍</span>
      <button class="text-btn" data-sa>全选</button>
    </div>
    <div id="select-bar" class="select-bar hidden">
      <button data-act="pin" data-icon="pin" data-label="置顶"></button>
      <button data-act="move" data-icon="folder" data-label="文件夹"></button>
      <button data-act="tags" data-icon="tag" data-label="标签"></button>
      <button data-act="cover" data-icon="image" data-label="封面"></button>
      <button data-act="hide" data-icon="hide" data-label="隐藏"></button>
      <button data-act="more" data-icon="more" data-label="更多"></button>
    </div>

    <!-- Reading statistics -->
    <div id="stats-sheet" class="sheet-modal fixed hidden">
      <div class="sheet-card tall stats-card">
        <div class="sheet-grip"></div>
        <div class="sheet-head">
          <button class="sheet-x" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="sheet-tabs"><button class="on">阅读统计</button></div>
          <span></span>
        </div>
        <div class="st-tabs"></div>
        <div class="sheet-scroll st-body"></div>
      </div>
    </div>

    <!-- More menu: backup / restore -->
    <div id="more-sheet" class="sheet-modal fixed hidden">
      <div class="sheet-card">
        <div class="sheet-grip"></div>
        <button class="sheet-item" id="btn-hidden">隐藏的书<small>查看和管理隐藏起来的书</small></button>
        <button class="sheet-item" id="btn-sync">设备同步<small id="sync-sub">手机和电脑共用一个书架</small></button>
        <button class="sheet-item" id="btn-backup">备份书架<small>把所有书和进度存成一个文件</small></button>
        <label class="sheet-item">恢复备份<small>选之前存的备份文件</small>
          <input type="file" id="restore-picker" accept=".json,application/json" hidden>
        </label>
        <button class="sheet-item cancel" id="btn-more-close">取消</button>
        <div class="app-version">Folio v1.2.3</div>
      </div>
    </div>
    <div class="shelf-sub">
      <p id="shelf-count" class="shelf-count"></p>
      <button id="btn-select" class="text-btn hidden">选择</button>
    </div>
    <div id="continue" class="continue hidden"></div>
    <button id="shelf-theme" class="shelf-theme" aria-label="切换底色"><span></span></button>
    <div id="chips" class="chips"></div>
    <div id="grid" class="grid"></div>
  </section>

  <!-- Reader -->
  <section id="reader" class="hidden">
    <!-- Two identical sheets used as a double buffer: the top one is visible,
         the hidden one is pre-laid-out with the next page. They swap after each turn. -->
    <div id="stack" class="stack">
      <div class="view"><div class="view-inner">
        <div class="running header"></div>
        <div class="page"><div class="flow"></div></div>
        <div class="running footer"></div>
        <div class="ribbon"></div>
        <div class="title-page"></div>
      </div></div>
      <div class="view"><div class="view-inner">
        <div class="running header"></div>
        <div class="page"><div class="flow"></div></div>
        <div class="running footer"></div>
        <div class="ribbon"></div>
        <div class="title-page"></div>
      </div></div>
      <div id="pull-ind" class="pull-ind">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>下拉添加书签</span>
      </div>
      <div id="curl-shadow" class="curl-shadow"></div>
      <div id="curl-back" class="curl-back"></div>
    </div>

    <div id="topbar" class="bar">
      <button id="btn-back">‹ 书架</button>
      <span id="book-title"></span>
      <button id="btn-bookmark" class="bar-icon" aria-label="书签">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="bottombar" class="bar">
      <div class="nav-row">
        <button id="btn-prev-ch" class="ch-btn">上一章</button>
        <div id="scrub" class="scrub">
          <div class="scrub-track"><i class="scrub-fill"></i></div>
          <div class="scrub-knob"></div>
          <div class="scrub-tip"></div>
        </div>
        <button id="btn-next-ch" class="ch-btn">下一章</button>
      </div>
      <div class="tool-row">
        <button id="btn-toc"><b>☰</b>目录</button>
        <button id="btn-smaller"><b>A</b>小</button>
        <button id="btn-bigger"><b style="font-size:1.3em">A</b>大</button>
        <button id="btn-theme"><b>◐</b>底色</button>
        <button id="btn-t2s"><b>简</b><span>原文</span></button>
        <button id="btn-turn"><b>❏</b><span>仿真</span></button>
      </div>
    </div>

    <div id="sel-layer"></div>
    <div id="sel-menu" class="hidden"></div>
    <div id="toc-panel" class="sheet-modal hidden"></div>
    <div id="note-editor" class="hidden"></div>
    <div id="note-panel" class="sheet-modal hidden"></div>
  </section>

  <script src="ui.js?v=1.2.3"></script>
  <script src="lib/t2s.js?v=1.2.3"></script>
  <script src="db.js?v=1.2.3"></script>
  <script src="importer.js?v=1.2.3"></script>
  <script src="formats.js?v=1.2.3"></script>
  <script src="reader.js?v=1.2.3"></script>
  <script src="annotations.js?v=1.2.3"></script>
  <script src="stats.js?v=1.2.3"></script>
  <script src="cover.js?v=1.2.3"></script>
  <script src="epub.js?v=1.2.3"></script>
  <script src="library.js?v=1.2.3"></script>
  <script src="sync.js?v=1.2.3"></script>
  <script src="app.js?v=1.2.3"></script>
</body>
</html>
